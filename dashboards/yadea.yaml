  - type: grid
    cards:
    - type: markdown
      content: "**YADEA · SMART MOTO**  \n**白鲨Ⅱ-G PRO**\n\n# {{ (states('sensor.bai_sha_ii_g_battery') if states('sensor.bai_sha_ii_g_battery') not in ('unknown', 'unavailable', 'None') else '—') }}%\n\n**续航 {{ (states('sensor.bai_sha_ii_g_remaining_range') if states('sensor.bai_sha_ii_g_remaining_range') not in ('unknown', 'unavailable', 'None') else '—') }} km**\n\n电池 {{ (states('sensor.bai_sha_ii_g_battery_count') if states('sensor.bai_sha_ii_g_battery_count') not in ('unknown', 'unavailable', 'None') else '—') }} 组 · 本月 {{ (states('sensor.bai_sha_ii_g_mileage_this_month') if states('sensor.bai_sha_ii_g_mileage_this_month') not in ('unknown', 'unavailable', 'None') else '—') }} km · 上报 {% set ts = as_timestamp(states('sensor.bai_sha_ii_g_last_report')) %}{% if ts > 0 %}{% set d = (as_timestamp(now()) - ts) | int %}{% if d < 3600 %}{{ (d // 60) }} 分钟前{% elif d < 86400 %}{{ (d // 3600) }} 小时前{% else %}{{ (d // 86400) }} 天前{% endif %}{% else %}—{% endif %}\n"
