# 雅迪智行 · Home Assistant 仪表盘示例（6 视图统一深色主题）
# 依赖：card-mod；旗舰版/骑行轨迹另需 apexcharts-card、bar-card 与 mushroom（HACS）
# 用法：复制到「设置 → 仪表盘 → 添加仪表盘 → YAML 模式」，替换实体 ID 前缀即可
# v2.0.0：里程/轨迹全部来自雅迪云端骑行记录（车主账号可见）
title: 雅迪电动车
views:
- title: 总览 · 经典
  path: classic
  icon: mdi:view-dashboard
  background: 'radial-gradient(1400px 800px at 12% -8%, #1b2b49 0%, #0b1220 58%, #070b14 100%)'
  cards:
  - type: vertical-stack
    cards:
    - type: heading
      heading: 白鲨Ⅱ-G PRO
      icon: mdi:motorbike-electric
      heading_style: title
      card_mod:
        style: |-
          ha-card {
            --ha-heading-card-title-color: #e2e8f0;
            --ha-heading-card-subtitle-color: #94a3b8;
            --ha-heading-card-title-font-weight: 600;
            --ha-heading-card-subtitle-font-weight: 600;
          }
          .content { letter-spacing: .6px; }
          .content ha-icon { color: #60a5fa !important; }
    - type: picture
      image_entity: image.bai_sha_ii_g
      card_mod:
        style: 'ha-card { border-radius: 24px; overflow: hidden; border: 1px solid rgba(120,160,255,0.14); box-shadow: 0 16px 36px rgba(2,6,23,0.50); background: #0b1220; }}'
    - type: horizontal-stack
      cards:
      - type: gauge
        entity: sensor.bai_sha_ii_g_battery
        name: 电量
        min: 0
        max: 100
        needle: false
        severity:
          green: 50
          yellow: 20
          red: 0
        card_mod:
          style: |-
            ha-card {
              --ha-card-background: transparent;
              --primary-text-color: #f1f5f9;
              --secondary-text-color: #94a3b8;
              --divider-color: rgba(148,163,184,0.16);
              --state-icon-color: #7dd3fc;
              background: linear-gradient(158deg, rgba(18,27,45,0.94) 0%, rgba(9,14,26,0.96) 100%) !important;
              border: 1px solid rgba(120,160,255,0.12);
              border-radius: 20px;
              box-shadow: 0 12px 30px rgba(2,6,23,0.40);
              overflow: hidden;
            }
      - type: gauge
        entity: sensor.bai_sha_ii_g_remaining_range
        name: 续航 (km)
        min: 0
        max: 200
        needle: false
        severity:
          green: 50
          yellow: 20
          red: 0
        card_mod:
          style: |-
            ha-card {
              --ha-card-background: transparent;
