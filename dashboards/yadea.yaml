- title: 进阶版
  path: advanced
  icon: mdi:auto-fix
  type: sections
  max_columns: 2
  background: 'radial-gradient(1400px 800px at 12% -8%, #1b2b49 0%, #0b1220 58%, #070b14 100%)'
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      primary: 白鲨Ⅱ-G PRO
      secondary: 电量 {{ states('sensor.bai_sha_ii_g_battery') }}% · 续航 {{ states('sensor.bai_sha_ii_g_remaining_range') }} km
      icon: mdi:motorbike-electric
      icon_color: blue
      tap_action:
        action: more-info
        entity: sensor.bai_sha_ii_g_battery
      card_mod:
        style: |-
          ha-card {
            border: 1px solid rgba(120,160,255,0.16);
            border-radius: 24px;
            min-height: 200px;
            padding: 4px 8px;
            overflow: hidden;
            background:
              linear-gradient(0deg, rgba(8,13,24,0.85) 0%, rgba(8,13,24,0) 26%),
              linear-gradient(90deg, rgba(8,13,24,0.99) 0%, rgba(8,13,24,0.95) 28%, rgba(8,13,24,0.30) 50%, rgba(8,13,24,0) 68%),
              url("https://tsposs.yadeaiot.com.cn/tsp/vehicle/static/c04653a1cc164f59b6178c7445a4dbc5.png") right 2px center / contain no-repeat,
              linear-gradient(160deg, #16233c 0%, #0a1020 100%);
            box-shadow: 0 18px 40px rgba(2,6,23,0.55);
          }
          ha-card .primary {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.12rem;
            letter-spacing: 0.3px;
          }
          ha-card .secondary {
            color: rgba(226,232,240,0.86);
            font-size: 0.92rem;
          }
          ha-card mushroom-shape-icon {
            --icon-size: 46px;
            background: rgba(59,130,246,0.22) !important;
          }
          ha-card .icon {
            color: #7dd3fc !important;
          }
    - type: custom:mushroom-chips-card
      chips:
      - type: template
        icon: mdi:battery-high
        icon_color: green
        content: '{{ states(''sensor.bai_sha_ii_g_battery'') }}%'
