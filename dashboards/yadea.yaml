- title: 精简总览
  path: compact
  icon: mdi:view-grid-plus
  type: sections
  max_columns: 4
  background: 'radial-gradient(1400px 800px at 12% -8%, #1b2b49 0%, #0b1220 58%, #070b14 100%)'
  sections:
  - type: grid
    cards:
    - type: picture-elements
      image_entity: image.bai_sha_ii_g
      title: 白鲨Ⅱ-G PRO
      elements:
      - type: state-label
        entity: sensor.bai_sha_ii_g_battery
        prefix: '电量 '
        style:
          color: '#e2e8f0'
          background: rgba(8,13,24,0.72)
          border: 1px solid rgba(148,163,184,0.20)
          border-radius: 99px
          padding: 6px 12px
          font-weight: '600'
          font-size: 105%
          backdrop-filter: blur(6px)
          box-shadow: 0 2px 8px rgba(0,0,0,0.35)
          top: 6%
          left: 2%
          transform: translate(0, -50%)
      - type: state-label
        entity: sensor.bai_sha_ii_g_remaining_range
        prefix: '续航 '
        style:
          color: '#e2e8f0'
          background: rgba(8,13,24,0.72)
          border: 1px solid rgba(148,163,184,0.20)
          border-radius: 99px
          padding: 6px 12px
          font-weight: '600'
          font-size: 105%
          backdrop-filter: blur(6px)
          box-shadow: 0 2px 8px rgba(0,0,0,0.35)
          top: 20%
          left: 2%
